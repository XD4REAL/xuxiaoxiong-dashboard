<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#ff9aa2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="许小熊">
<link rel="manifest" href="/static/manifest.json">
<link rel="apple-touch-icon" href="/static/avatar.jpg">
<title>记忆管理 - 许小熊</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  background: #ededed;
  min-height: 100vh;
}
.header {
  background: #ff9aa2;
  padding: 14px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  position: sticky;
  top: 0;
  z-index: 10;
}
.header a { color: #fff; text-decoration: none; font-size: 16px; }
.header h1 { color: #fff; font-size: 18px; flex: 1; text-align: center; }
.count {
  text-align: center;
  padding: 12px;
  color: #888;
  font-size: 14px;
  background: #fff;
  border-bottom: 1px solid #e5e5e5;
}
.card {
  background: #fff;
  margin: 8px 12px;
  padding: 14px;
  border-radius: 8px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
}
.card-left { flex: 1; min-width: 0; }
.card-fact { font-size: 15px; font-weight: 600; color: #333; margin-bottom: 4px; display: flex; align-items: center; gap: 8px; }
.card-fact .hot-badge {
  font-size: 12px;
  padding: 2px 8px;
  border-radius: 10px;
  font-weight: 500;
  white-space: nowrap;
}
.hot-badge.l3 { background: #ffe0e0; color: #d63031; }
.hot-badge.l2 { background: #fff3e0; color: #e17055; }
.hot-badge.l1 { background: #e8f5e9; color: #388e3c; }
.hot-badge.l0 { background: #f5f5f5; color: #aaa; }
.card-meta {
  display: flex;
  gap: 12px;
  font-size: 11px;
  color: #bbb;
  margin-top: 4px;
}
.card-del {
  background: #ff6b6b;
  color: #fff;
  border: none;
  padding: 8px 14px;
  border-radius: 6px;
  font-size: 13px;
  cursor: pointer;
  flex-shrink: 0;
}
.card-del:active { opacity: 0.7; }
.empty { text-align: center; padding: 60px 20px; color: #aaa; font-size: 15px; }
</style>
</head>
<body>
<div class="header">
  <a href="/">← 聊天</a>
  <h1>记忆管理</h1>
  <a href="/dashboard">仪表盘</a>
</div>
<div class="count" id="count">加载中...</div>
<div id="list"></div>
<div class="empty" id="empty" style="display:none">还没有记忆呢~ OvO</div>

<script>
async function load() {
  const resp = await fetch('/api/memories');
  const facts = await resp.json();
  document.getElementById('count').textContent = `共 ${facts.length} 条记忆`;
  const list = document.getElementById('list');
  const empty = document.getElementById('empty');
  list.innerHTML = '';
  if (facts.length === 0) {
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';
  facts.forEach((f, i) => {
    const act = f.activation || 0;
    let level, badge;
    if (act >= 10) { level = 'l3'; badge = '🔥 热门'; }
    else if (act >= 5) { level = 'l2'; badge = '🔥 活跃'; }
    else if (act >= 1) { level = 'l1'; badge = '🌱 温记忆'; }
    else { level = 'l0'; badge = '❄️ 冷记忆'; }
    const last = f.last_accessed ? '最近: ' + f.last_accessed : '从未访问';
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="card-left">
        <div class="card-fact">${esc(f.fact)}<span class="hot-badge ${level}">${badge} ×${act}</span></div>
        <div class="card-value">${esc(f.value)}</div>
        <div class="card-meta"><span>来源: ${esc(f.source)}</span><span>${last}</span></div>
      </div>
      <button class="card-del" onclick="del(${i}, this)">删除</button>
    `;
    list.appendChild(card);
  });
}

async function del(index, btn) {
  if (!confirm('确定删除这条记忆吗？')) return;
  const resp = await fetch(`/api/memories/${index}`, { method: 'DELETE' });
  if (resp.ok) {
    btn.closest('.card').remove();
    const left = document.querySelectorAll('.card').length;
    document.getElementById('count').textContent = `共 ${left} 条记忆`;
    if (left === 0) document.getElementById('empty').style.display = 'block';
  }
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

load();
</script>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js');
}
</script>
</body>
</html>
